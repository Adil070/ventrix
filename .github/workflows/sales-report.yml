# Triggers the scheduled sales report (free; no timer runs inside the API, so it works on hosts that sleep).
# Repo secrets: API_URL (e.g. https://api.example.com, no trailing slash) and CRON_SECRET (same value as the API's).
name: Sales report

on:
  schedule:
    # 07:00, 11:00, 15:00, 19:00 and 22:00 IST (UTC+5:30). GitHub may start a run a few minutes late;
    # the API files a late call under the slot it belongs to, and repeat calls for a slot are ignored.
    - cron: '30 1,5,9,13,16 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Run sales report
        # --retry covers a sleeping free-tier API that answers 502/503 while it wakes up.
        run: |
          curl --fail-with-body -sS --retry 4 --retry-delay 30 --max-time 120 \
            -X POST "${{ secrets.API_URL }}/api/v1/internal/sales-reports/run" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
